ize:17px}.reading{padding:0 23px}.reading p{font-size:17px;line-height:1.95}.reading h2{font-size:23px}.cover{padding:0;margin-bottom:35px}.cover figcaption{padding:0 22px}.footer{margin:45px 20px 0;gap:20px;line-height:1.8}}</style></head><body><div class="topline"><header><a class="brand" href="./">Electro News<small>NEWSPAPER LAB · DAILY JOURNAL</small></a><nav class="languages"><a class="selected" href="./?lang=ko">KO</a><a class="" href="./?lang=en">EN</a><a class="" href="./?lang=ja">JA</a><a class="" href="./?lang=zh">中文</a></nav></header></div><div class="schedule">매일 오전 7시, 새로운 기사를 전합니다.</div><main class="wrap"><div class="mast"><h1 id="latest">최신 기사</h1><input type="search" id="search" aria-label="기사 검색" placeholder="기사 검색"></div><div id="stories"></div></main><script>const L={"ko": ["매일 오전 7시, 새로운 기사를 전합니다.", "최신 기사", "기사 검색", "전체 기사", "출처 및 참고 자료", "AI 생성 일러스트 · 실제 촬영 사진이 아닙니다.", "Newspaper Lab 편집", "읽기", "분"], "en": ["Fresh stories every morning at 7 AM KST.", "Latest stories", "Search stories", "All stories", "Sources & further reading", "AI-generated illustration · not a documentary photograph.", "Newspaper Lab", "Read", "min"], "ja": ["毎朝7時（韓国時間）、新しい記事をお届けします。", "最新の記事", "記事を検索", "すべての記事", "情報源と参考資料", "AI生成イラスト・実際の撮影写真ではありません。", "Newspaper Lab 編集", "読む", "分"], "zh": ["每天韩国时间早上7点，为你带来新文章。", "最新文章", "搜索文章", "全部文章", "来源与参考资料", "AI生成插画，非实拍照片。", "Newspaper Lab 编辑", "阅读", "分钟"]};let lang=new URL(location).searchParams.get('lang')||localStorage.getItem('language')||'ko';if(!L[lang])lang='ko';let data={"updated": "2026-11-03", "articles": [{"id": "buds-on-us-20261028", "date": "2026-10-28", "source": "Samsung Mobile Press", "url": "https://www.samsungmobilepress.com/articles/galaxy-buds-on-comfortable-open-ear-listening-us", "category": {"ko": "오디오", "en": "Audio", "ja": "オーディオ", "zh": "音频"}, "locales": {"ko": {"title": "Galaxy Buds On, 미국 출시 소식", "summary": "Samsung Mobile Press가 Galaxy Buds On의 미국 출시를 알렸습니다. 오픈이어 청취 경험을 강조한 제품입니다.", "body": "귀를 막지 않는 이어폰이란\n오픈이어 이어폰은 주변 소리를 들으면서 음악과 통화를 이용하려는 사용 방식에 초점을 맞춘다. 귀를 밀폐해 몰입하는 제품과 목적이 다르다. 따라서 이 제품을 볼 때에는 소음 차단 성능을 먼저 묻기보다, 내가 주변 상황을 들어야 하는 시간이 얼마나 많은지부터 생각하는 편이 맞다.\n\n이번 미국 발표의 핵심\n삼성전자는 10월 28일 Galaxy Buds On의 미국 판매 계획을 공개했다. 공식 발표에 따르면 클립형 디자인이며, 미국에서는 11월 초 블랙 색상을 229달러에 출시할 예정이다. 발표일과 판매 시작일은 같지 않다. 미국 가격을 환율로만 바꾼 값도 국내 정식 가격으로 볼 수 없다.\n\n누구에게 유용할까\n산책하면서 동행의 말을 듣거나 실내에서 주변 대화에 반응해야 하는 상황이라면 오픈이어 방식이 선택지가 될 수 있다. 반대로 주변 소음에서 벗어나 집중하는 것이 목표라면 다른 형태의 이어폰과 비교할 필요가 있다. 이는 사용 목적에 대한 판단 기준이며 해당 제품의 음질이나 착용감을 직접 검증한 평가는 아니다.\n\n스펙보다 먼저 확인할 조건\n삼성은 한 번 충전으로 최대 9.5시간, 케이스를 포함해 최대 38시간의 음악 재생을 안내한다. 이는 제조사 시험 조건의 수치로 실제 사용 시간과 차이가 날 수 있다. 구매 전에는 귀 형태에 맞는 착용감, 주변으로 소리가 새는 정도, 휴대전화별 기능 지원과 현지 보증을 확인하는 것이 좋다. 특히 소프트웨어 기능은 연결 기기와 국가에 따라 달라질 수 있다.\n\n이번 뉴스를 읽는 관점\n이어폰 선택이 소리를 얼마나 가릴지에서 주변과 어떻게 함께 들을지로 넓어지고 있다는 점에 주목할 만하다. 다만 개별 제품의 성공 여부는 실사용 평가와 현지 판매 조건을 함께 확인한 뒤 판단해야 한다."}, "en": {"title": "Galaxy Buds On arrives in the US", "summary": "Samsung Mobile Press announced the US launch of Galaxy Buds On, highlighting an open-ear listening experience.", "body": "What is open-ear listening?\nOpen-ear earbuds focus on listening to audio while remaining aware of nearby sounds. Their purpose differs from a sealed design built for immersion. The first question is therefore not how much noise they block, but how often you need to hear the world around you.\n\nWhat Samsung announced\nOn October 28, Samsung announced US availability for Galaxy Buds On. Its release describes a clip-on design and a black model scheduled for early November at $229. The announcement date is not the sales date, and converting the dollar price does not establish an official local price.\n\nWho might find the format useful?\nSomeone walking with a companion or responding to nearby conversations may value an open design. Someone seeking isolation should compare a different type of earbud. These are ways to think about the use case, not conclusions from a hands-on test of this product.\n\nCheck the conditions behind the numbers\nSamsung lists up to 9.5 hours of music playback, or 38 hours including the case. Those are manufacturer test figures, not guaranteed everyday results. Fit, sound leakage, phone compatibility and local warranty deserve attention before a purchase. Software features may differ by connected device and country.\n\nThe broader question\nThe interesting shift is from asking only how much sound an earbud blocks to considering how audio fits into a shared environment. Product quality still requires independent testing and local-market information."}, "ja": {"title": "Galaxy Buds On、米国で発売", "summary": "Samsung Mobile Pressは、オープンイヤーのリスニング体験を特徴とするGalaxy Buds Onの米国発売を案内しました。", "body": "オープンイヤーとは\n周囲の音を聞きながら音楽や通話を利用することを重視した方式だ。耳を密閉して集中する製品とは目的が違う。遮音性能だけでなく、周囲の様子を聞く必要がどれほどあるかを考えたい。\n\n米国発表の内容\nSamsungは10月28日、Galaxy Buds Onの米国販売計画を発表した。クリップ型で、ブラックを11月上旬に229ドルで発売する予定だ。発表日と販売開始日は異なる。ドル価格を換算しただけの金額も、各国の正式価格ではない。\n\nどんな場面に向くか\n散歩中に同行者の声を聞いたり、室内の会話に反応したりする用途なら選択肢になり得る。一方、周囲から離れて集中したいなら別方式と比較したい。これは用途の考え方であり、実機の音質や装着感を評価したものではない。\n\n数字の条件も確認\nメーカーは音楽再生を単体で最大9.5時間、ケース込みで最大38時間と案内する。ただし試験条件の値で、実際の時間は変わり得る。装着感、音漏れ、スマートフォンとの機能互換性、現地保証も重要だ。ソフトウェア機能は機器や国によって異なる場合がある。\n\nニュースの見方\n遮音の強さだけでなく、周囲の環境と音楽をどう共存させるかへ選択軸が広がっている。製品そのものの評価は実機検証と現地の販売条件を待って判断したい。"}, "zh": {"title": "Galaxy Buds On在美国推出", "summary": "Samsung Mobile Press宣布Galaxy Buds On在美国推出，主打开放式聆听体验。", "body": "什么是开放式聆听\n开放式耳机强调在听音乐和通话时保留对周围声音的感知，与密闭式产品追求沉浸的目标有所不同。选择时不应只问隔音多强，也应想想自己多常需要听到周围环境。\n\n美国公告说了什么\nSamsung于10月28日公布Galaxy Buds On的美国销售计划。公告介绍了耳夹式设计，黑色款预计11月上旬以229美元销售。发布日期不同于开售日期，美元价格的汇率换算也不等于其他市场的官方售价。\n\n适合哪些场景\n散步时听见同行者，或在室内回应周围谈话，可能是开放式设计的使用场景。如果目标是隔绝噪声、专心聆听，则应比较其他类型。这是对使用需求的分析，不是对该产品音质或佩戴感的实际测试。\n\n数字背后的条件\nSamsung标示单次充电音乐播放最长9.5小时，含充电盒最长38小时。这是制造商测试条件下的数据，实际表现可能不同。购买前还应确认佩戴感、漏音、手机功能兼容性与当地保修。软件功能也可能因设备与国家而不同。\n\n如何看待这条新闻\n耳机的选择标准正在从隔绝多少声音，扩展到如何与周围环境共同聆听。具体产品是否值得购买，仍需结合独立测试与当地销售条件判断。"}}, "sources": [{"name": "Samsung Mobile Press", "url": "https://www.samsungmobilepress.com/articles/galaxy-buds-on-comfortable-open-ear-listening-us"}], "image": {"url": "assets/cover.svg", "generated": true, "alt": {"ko": "기사 주제의 AI 일러스트", "en": "AI illustration of the article topic", "ja": "記事テーマのAIイラスト", "zh": "文章主题的AI插画"}}}]};const $=s=>document.querySelector(s);function render(){localStorage.setItem('language',lang);document.documentElement.lang=lang==='zh'?'zh-Hans':lang;$('.schedule').textContent=L[lang][0];$('#latest').textContent=L[lang][1];$('#search').placeholder=L[lang][2];document.querySelectorAll('.languages a').forEach(e=>{e.classList.toggle('selected',new URL(e.href).searchParams.get('lang')===lang)});const q=$('#search').value.toLowerCase(),items=data.articles.filter(a=>(a.locales[lang].title+a.locales[lang].summary).toLowerCase().includes(q));const container=$('#stories');container.replaceChildren();for(const [i,a]of items.entries()){const v=a.locales[lang],article=document.createElement('article');article.className=i===0?'lead':'secondary';const link=document.createElement('a');link.href='articles/'+a.id+'/'+lang+'.html';const img=document.createElement('img');img.src=a.image?.url||'';img.alt=a.image?.alt?.[lang]||'';link.append(img);const copy=document.createElement('div');for(const [tag,c,txt]of [['p','kicker',a.category[lang]],['h2','',v.title],['p','summary',v.summary],['p','meta',a.date+' · NEWSPAPER LAB']]){const e=document.createElement(tag);e.className=c;e.textContent=txt;copy.append(e)}const go=document.createElement('a');go.className='arrow';go.href=link.href;go.textContent=L[lang][7]+' ↗';copy.append(go);article.append(link,copy);container.append(article)}if(!items.length)container.textContent='—';}$('#search').oninput=render;render();fetch('./news.json').then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{});</script><footer class="footer"><span>Electro News / NEWSPAPER LAB</span><span>© 2026 · 매일 오전 7시, 새로운 기사를 전합니다.</span></footer></body></html>
